name: Native encrypted-recovery release gate

on:
  workflow_dispatch:
    inputs:
      ios_device:
        description: "Exact booted iOS simulator/device ID"
        required: false
        type: string
      android_device:
        description: "Exact booted Android emulator/device ID"
        required: false
        type: string
      signed_build_identifier:
        description: "Non-sensitive identifier for the installed signed native build"
        required: true
        type: string

permissions:
  contents: read

jobs:
  encrypted-recovery:
    name: Verify encrypted recovery on signed native builds
    # This runner must have one disposable booted iOS target, one disposable
    # booted Android target, xcrun, adb, and Maestro 1.40 available.
    runs-on: [self-hosted, calora-native]
    timeout-minutes: 30
    env:
      CALORA_IOS_DEVICE: ${{ inputs.ios_device }}
      CALORA_ANDROID_DEVICE: ${{ inputs.android_device }}
      CALORA_ENCRYPTED_RECOVERY_SIGNED_BUILD_IDENTIFIER: ${{ inputs.signed_build_identifier }}
      CALORA_ENCRYPTED_RECOVERY_BUILD_CHECK: "true"
    steps:
      - name: Check out release candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.26.1

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - name: Preflight native runner and run encrypted-recovery release gate
        working-directory: artifacts/calora
        env:
          CALORA_ENCRYPTED_RECOVERY_EVIDENCE_PATH: ${{ runner.temp }}/calora-encrypted-recovery-evidence.json
        run: pnpm test:release:encrypted-recovery

      - name: Upload sanitized encrypted-recovery evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: calora-encrypted-recovery-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/calora-encrypted-recovery-evidence.json
          if-no-files-found: error
          retention-days: 30
