name: Portable PostgreSQL database integrations

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Run portable fresh-schema integrations (PostgreSQL 16)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/calora_integration_ci
      CALORA_RUN_DB_INTEGRATION_TESTS: "true"
    services:
      postgres:
        image: postgres:16@sha256:a3b7f434b2dc57ce85a67e171163eb8ab1a1ebcb39d27484661f26b1dfbe30d6 # PostgreSQL 16 OCI index
        env:
          POSTGRES_DB: calora_integration_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d calora_integration_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.26.1

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Bootstrap an explicitly approved empty Calora schema
        run: >-
          pnpm --filter @workspace/db run bootstrap-empty-target
          -- --approve-empty-calora-target

      - name: Apply immutable Calora migrations
        run: pnpm --filter @workspace/db run migrate

      - name: Provision Calora support objects
        run: pnpm --filter @workspace/db run provision-support-objects

      - name: Build API artifact for the rolling-restart integration
        run: pnpm --filter @workspace/api-server run build

      - name: Run the portable PostgreSQL integration suite
        run: pnpm --filter @workspace/api-server run test:integration:postgres
