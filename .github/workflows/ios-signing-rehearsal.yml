name: iOS signing rehearsal contract

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rehearsal:
    name: Run the Apple signing rehearsal contract
    runs-on: macos-14
    timeout-minutes: 10
    env:
      CALORA_IOS_SIGNING_REHEARSAL_OUTPUT_DIR: ${{ runner.temp }}/calora-ios-signing-rehearsal
    steps:
      - name: Check out release candidate
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Run fixture-backed Apple rehearsal contract
        working-directory: artifacts/calora
        run: node scripts/ios-signing-apple-rehearsal-contract.js

      - name: Check archived evidence before retention
        if: always()
        env:
          EVIDENCE_DIRECTORY: ${{ runner.temp }}/calora-ios-signing-rehearsal
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");

          const evidenceDirectory = process.env.EVIDENCE_DIRECTORY;
          const files = fs.existsSync(evidenceDirectory)
            ? fs.readdirSync(evidenceDirectory)
                .filter((file) => file.endsWith(".json"))
                .map((file) => path.join(evidenceDirectory, file))
            : [];
          if (files.length !== 2) {
            throw new Error(`Expected two evidence archives, found ${files.length}.`);
          }

          const forbiddenPatterns = [
            /raw EAS output/i,
            /fixture-eas-token/i,
            /fixture-certificate-password/i,
            /fixture-private-key/i,
            /Bearer\s+\S+/i,
            /certificatePassword\s*=/i,
            /(?:certificate(?:p12|password)|password|token|secret|private\s+key)\s*[:=]\s*\S+/i,
            /-----BEGIN [^-]+-----/i,
          ];
          for (const file of files) {
            const text = fs.readFileSync(file, "utf8");
            JSON.parse(text);
            for (const pattern of forbiddenPatterns) {
              if (pattern.test(text)) {
                throw new Error(`Evidence archive failed sanitization check: ${path.basename(file)}.`);
              }
            }
          }
          console.log(`Validated ${files.length} sanitized evidence archives before upload.`);
          NODE

      - name: Upload sanitized Apple rehearsal evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calora-ios-signing-rehearsal-${{ github.run_id }}
          path: ${{ runner.temp }}/calora-ios-signing-rehearsal/*.json
          if-no-files-found: error
          retention-days: 30