name: Release validation

on:
  push:
    branches:
      - release/calora-onboarding-and-plus
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-validation:
    name: Run release validation suite
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Audit required branch checks
        env:
          GITHUB_TOKEN: ${{ secrets.CALORA_RELEASE_GATE_ADMIN_READ_TOKEN }}
        run: node scripts/audit-required-checks.mjs

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit workspace dependencies
        run: pnpm run audit:release

      - name: Run release validation suite
        run: pnpm --filter @workspace/scripts test
