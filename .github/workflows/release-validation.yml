name: Release validation

on:
  push:
    branches:
      - main
      - release/calora-onboarding-and-plus
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-validation:
    name: Run release validation suite
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Verify database source provenance boundary
        run: >-
          node scripts/verify-db-source-provenance.mjs
          "$RUNNER_TEMP/calora-database-source-provenance.json"

      - name: Set up pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.26.1

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - name: Audit required branch checks
        env:
          GITHUB_TOKEN: ${{ secrets.CALORA_RELEASE_GATE_ADMIN_READ_TOKEN }}
        run: node scripts/audit-required-checks.mjs

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate authoritative Expo configuration
        run: node scripts/ci/validate-expo-config.mjs artifacts/calora/app.json

      - name: Audit workspace dependencies
        run: pnpm run audit:release

      - name: Verify release-attestation fixtures
        run: |
          pnpm --filter @workspace/scripts run test:release:build-clean-checkout
          pnpm --filter @workspace/api-server run test:release-attestation

      - name: Run repository typecheck
        run: pnpm run typecheck

      - name: Run complete test suite
        env:
          # Deterministic non-production values for Calora's offline Vitest
          # suite. Production configuration remains required at runtime.
          # The API's Drizzle module validates DATABASE_URL at import time.
          # test:offline imports the DB module but excludes integration tests;
          # the dedicated fresh-schema jobs run those against PostgreSQL.
          DATABASE_URL: postgresql://calora-test:calora-test@127.0.0.1:1/calora_test
          EXPO_PUBLIC_SUPABASE_URL: https://calora-test.invalid
          EXPO_PUBLIC_SUPABASE_ANON_KEY: calora-vitest-anon-key
          # Offline API tests import the OpenAI client but mock provider calls.
          # These loopback/invalid sentinels prevent import-time failures and
          # cannot reach a real provider.
          AI_INTEGRATIONS_OPENAI_BASE_URL: http://127.0.0.1:1/openai-test
          AI_INTEGRATIONS_OPENAI_API_KEY: calora-vitest-openai-key
        run: |
          pnpm --filter @workspace/calora run test
          pnpm --filter @workspace/calora run test:release:native-preflight-unit
          pnpm --filter @workspace/api-server run test:offline
          pnpm --filter @workspace/scripts run test

      - name: Build API production artifact
        env:
          NODE_ENV: production
          RELEASE_SENSITIVE_ACTIVATION_REQUESTED: "false"
          RELEASE_SENSITIVE_ACTIVATION_COMMIT: ""
        run: pnpm --filter @workspace/api-server run build

      - name: Build Calora production static artifact
        env:
          EXPO_PUBLIC_DOMAIN: calorie-coach-pie35449.replit.app
          EXPO_PUBLIC_API_URL: https://calorie-coach-pie35449.replit.app
        run: pnpm --filter @workspace/calora run build

  release-validation-gate:
    name: Attest release validation gate
    needs: release-validation
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: Check out validated source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Create same-SHA validation gate
        run: >-
          node scripts/release-workflow-provenance.mjs create-validation-gate
          "$RUNNER_TEMP/calora-release-validation-gate.json"

      - name: Create source-only database provenance manifest
        run: >-
          node scripts/verify-db-source-provenance.mjs
          "$RUNNER_TEMP/calora-database-source-provenance.json"

      - name: Upload validation gate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: calora-release-validation-gate
          path: |
            ${{ runner.temp }}/calora-release-validation-gate.json
            ${{ runner.temp }}/calora-database-source-provenance.json
          if-no-files-found: error
          retention-days: 90

      - name: Attest validation gate
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ runner.temp }}/calora-release-validation-gate.json

      - name: Attest source-only database provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ runner.temp }}/calora-database-source-provenance.json
