name: Calora database recovery bundle

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Approved non-production recovery target"
        required: true
        type: choice
        options:
          - staging
          - disposable-rehearsal
      target_attestation:
        description: "Exact owner-approved attestation for the selected target"
        required: true
        type: string
      storage_manifest:
        description: "Workspace-relative sanitized storage manifest path"
        required: false
        type: string
      provider_manifest:
        description: "Workspace-relative sanitized provider-state manifest path"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: calora-recovery-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  validate-target:
    name: Validate requested recovery target
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      github_environment: ${{ steps.target.outputs.github_environment }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Select approved target metadata
        id: target
        env:
          TARGET: ${{ inputs.target }}
          ATTESTATION: ${{ inputs.target_attestation }}
          WORKFLOW_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [[ "$WORKFLOW_REF" != 'refs/heads/main' ]]; then
            echo 'Recovery workflow must run from protected main.' >&2
            exit 1
          fi
          case "$TARGET" in
            staging)
              expected_environment='calora-recovery-staging'
              expected_attestation='CALORA_STAGING_RECOVERY_V1'
              ;;
            disposable-rehearsal)
              expected_environment='calora-recovery-disposable'
              expected_attestation='CALORA_DISPOSABLE_RECOVERY_V1'
              ;;
            *)
              echo 'Recovery target is not approved.' >&2
              exit 1
              ;;
          esac
          if [[ "$ATTESTATION" != "$expected_attestation" ]]; then
            echo 'Recovery target attestation does not match the selected target.' >&2
            exit 1
          fi
          echo "github_environment=$expected_environment" >> "$GITHUB_OUTPUT"

  attest-target:
    name: Attest protected target metadata
    needs: validate-target
    if: needs.validate-target.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: ${{ needs.validate-target.outputs.github_environment }}
    outputs:
      github_environment: ${{ needs.validate-target.outputs.github_environment }}
    env:
      CALORA_RECOVERY_TARGET: ${{ inputs.target }}
      CALORA_RECOVERY_TARGET_ID: ${{ vars.CALORA_RECOVERY_TARGET_ID }}
      CALORA_RECOVERY_ENDPOINT_HOST: ${{ vars.CALORA_RECOVERY_ENDPOINT_HOST }}
      CALORA_RECOVERY_DATABASE_NAME: ${{ vars.CALORA_RECOVERY_DATABASE_NAME }}
      CALORA_RECOVERY_ATTESTATION: ${{ inputs.target_attestation }}
      GITHUB_REF: ${{ github.ref }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate non-secret target identity
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { validateRecoveryTarget } from "./scripts/recovery/validate-recovery-target.mjs";
          validateRecoveryTarget({
            target: process.env.CALORA_RECOVERY_TARGET,
            attestation: process.env.CALORA_RECOVERY_ATTESTATION,
            ref: process.env.GITHUB_REF,
            databaseUrl: `postgresql://${process.env.CALORA_RECOVERY_ENDPOINT_HOST}/${encodeURIComponent(process.env.CALORA_RECOVERY_DATABASE_NAME)}`,
            targetId: process.env.CALORA_RECOVERY_TARGET_ID,
            endpointHost: process.env.CALORA_RECOVERY_ENDPOINT_HOST,
            databaseName: process.env.CALORA_RECOVERY_DATABASE_NAME,
          });
          console.log(JSON.stringify({ result: "approved", target: process.env.CALORA_RECOVERY_TARGET }));
          NODE

  recovery-bundle:
    name: Create encrypted recovery bundle
    needs: attest-target
    if: needs.attest-target.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: ${{ needs.attest-target.outputs.github_environment }}
    env:
      CALORA_BACKUP_DATABASE_URL: ${{ secrets.CALORA_RECOVERY_DATABASE_URL }}
      CALORA_BACKUP_KEY_B64: ${{ secrets.CALORA_RECOVERY_BACKUP_KEY_B64 }}
      CALORA_RECOVERY_TARGET: ${{ inputs.target }}
      CALORA_RECOVERY_TARGET_ID: ${{ vars.CALORA_RECOVERY_TARGET_ID }}
      CALORA_RECOVERY_ENDPOINT_HOST: ${{ vars.CALORA_RECOVERY_ENDPOINT_HOST }}
      CALORA_RECOVERY_DATABASE_NAME: ${{ vars.CALORA_RECOVERY_DATABASE_NAME }}
      CALORA_RECOVERY_ATTESTATION: ${{ inputs.target_attestation }}
      GITHUB_REF: ${{ github.ref }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.26.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Revalidate target binding before database commands
        run: node scripts/recovery/validate-recovery-target.mjs
      - name: Create encrypted recovery bundle
        env:
          STORAGE_MANIFEST: ${{ inputs.storage_manifest }}
          PROVIDER_MANIFEST: ${{ inputs.provider_manifest }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/calora-recovery"
          args=(--output "$RUNNER_TEMP/calora-recovery/calora-${GITHUB_RUN_ID}.enc" --environment "$CALORA_RECOVERY_TARGET")
          [[ -n "$STORAGE_MANIFEST" ]] && args+=(--storage-manifest "$STORAGE_MANIFEST")
          [[ -n "$PROVIDER_MANIFEST" ]] && args+=(--provider-manifest "$PROVIDER_MANIFEST")
          node scripts/recovery/create-encrypted-backup.mjs "${args[@]}"
      - name: Validate encrypted recovery bundle before upload
        run: |
          set -euo pipefail
          node scripts/recovery/restore-encrypted-backup.mjs \
            --input "$RUNNER_TEMP/calora-recovery/calora-${GITHUB_RUN_ID}.enc" \
            --validate-only
      - name: Write sanitized recovery evidence
        if: success()
        run: |
          set -euo pipefail
          node - <<'NODE' > "$RUNNER_TEMP/calora-recovery/evidence.json"
          import crypto from "node:crypto";
          import fs from "node:fs";
          const file = process.env.RUNNER_TEMP + `/calora-recovery/calora-${process.env.GITHUB_RUN_ID}.enc`;
          const hash = crypto.createHash("sha256").update(fs.readFileSync(file)).digest("hex");
          process.stdout.write(JSON.stringify({
            schemaVersion: "calora.recovery-evidence.v1",
            result: "pass",
            runId: process.env.GITHUB_RUN_ID,
            target: process.env.CALORA_RECOVERY_TARGET,
            bundleSha256: hash,
            retentionDays: 30,
            createdAt: new Date().toISOString(),
          }) + "\n");
          NODE
      - name: Upload encrypted recovery bundle
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: calora-encrypted-recovery-${{ github.run_id }}
          path: ${{ runner.temp }}/calora-recovery/*.enc
          if-no-files-found: error
          retention-days: 30
      - name: Upload sanitized recovery evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: calora-recovery-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/calora-recovery/evidence.json
          if-no-files-found: warn
          retention-days: 30
      - name: Record failure evidence
        if: failure()
        run: |
          echo "Encrypted recovery bundle failed. No artifact should be treated as complete." >> "$GITHUB_STEP_SUMMARY"
          echo "Owner action: inspect the failed run, preserve logs, and do not retry against production without approval." >> "$GITHUB_STEP_SUMMARY"
