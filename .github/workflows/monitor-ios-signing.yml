name: Monitor iOS signing credential expiry

on:
  schedule:
    - cron: "37 4 * * *"
  workflow_dispatch:
    inputs:
      warning_days:
        description: "Warn when either iOS signing credential expires within this many days"
        required: false
        default: "30"
        type: string

permissions:
  contents: read

jobs:
  verify:
    name: Check EAS iOS signing credential expiry
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      EXPO_TOKEN: ${{ secrets.CALORA_EXPO_TOKEN }}
      IOS_SIGNING_WARNING_DAYS: ${{ inputs.warning_days || '30' }}
    steps:
      - name: Check out monitor
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.26.1

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: pnpm

      - name: Run read-only iOS signing expiry monitor
        working-directory: artifacts/calora
        run: pnpm test:release:ios-signing:monitor

      - name: Publish interactive repair path
        if: failure()
        run: |
          {
            echo "## iOS signing credential repair"
            echo
            echo "The read-only EAS preflight reported missing, invalid, or expiring credentials."
            echo "From artifacts/calora, run:"
            echo
            echo '    eas credentials --platform ios'
            echo
            echo 'Then choose "Build Credentials: Manage everything needed to build your project",'
            echo 'followed by "All: Set up all the required credentials to build your project".'
            echo
            echo "Reference: https://docs.expo.dev/app-signing/app-credentials/"
          } >> "$GITHUB_STEP_SUMMARY"
