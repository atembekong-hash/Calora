name: Production recipe-image QA

on:
  workflow_dispatch:
    inputs:
      expected_commit:
        description: Exact 40-character main commit currently expected on the live API
        required: true
        type: string
      confirmation:
        description: Type RUN_CALORA_PRODUCTION_RECIPE_IMAGE_QA to authorize one disposable QA lifecycle
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: calora-production-recipe-image-qa
  cancel-in-progress: false

jobs:
  verify-production-recipe-image:
    if: github.ref == 'refs/heads/main'
    name: Verify disposable recipe-image lifecycle
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: calora-production-recipe-image-qa
    env:
      CALORA_QA_RUN_CONFIRMATION: ${{ inputs.confirmation }}
      CALORA_QA_EXPECTED_COMMIT: ${{ inputs.expected_commit }}
      CALORA_QA_API_BASE_URL: ${{ secrets.CALORA_QA_API_BASE_URL }}
      CALORA_QA_SUPABASE_URL: ${{ secrets.CALORA_QA_SUPABASE_URL }}
      CALORA_QA_SUPABASE_ANON_KEY: ${{ secrets.CALORA_QA_SUPABASE_ANON_KEY }}
      CALORA_QA_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.CALORA_QA_SUPABASE_SERVICE_ROLE_KEY }}
      CALORA_QA_TEST_PASSWORD: ${{ secrets.CALORA_QA_TEST_PASSWORD }}
      CALORA_QA_CLEANUP_FILE: ${{ runner.temp }}/.calora-production-recipe-image-qa-cleanup.json
    steps:
      - name: Check out protected main source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Verify protected invocation and required QA configuration
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/main"
          test "${CALORA_QA_RUN_CONFIRMATION}" = "RUN_CALORA_PRODUCTION_RECIPE_IMAGE_QA"
          test "${#CALORA_QA_EXPECTED_COMMIT}" -eq 40
          test "${CALORA_QA_EXPECTED_COMMIT}" = "${GITHUB_SHA}"
          for name in \
            CALORA_QA_API_BASE_URL \
            CALORA_QA_SUPABASE_URL \
            CALORA_QA_SUPABASE_ANON_KEY \
            CALORA_QA_SUPABASE_SERVICE_ROLE_KEY \
            CALORA_QA_TEST_PASSWORD; do
            test -n "${!name}" || { echo "::error::Required protected QA configuration is unavailable."; exit 1; }
          done

      - name: Run one bounded private review and rejection lifecycle
        id: qa
        continue-on-error: true
        run: |
          set -o pipefail
          node scripts/production-recipe-image-qa.mjs \
            | tee "${RUNNER_TEMP}/calora-production-recipe-image-qa.json"

      - name: Recover an interrupted disposable QA lifecycle
        if: always()
        run: |
          set -o pipefail
          node scripts/production-recipe-image-qa.mjs --recover \
            | tee "${RUNNER_TEMP}/calora-production-recipe-image-qa-recovery.json"

      - name: Enforce a passing sanitized QA result
        if: always()
        run: |
          set -euo pipefail
          test -f "${RUNNER_TEMP}/calora-production-recipe-image-qa.json"
          node --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises";
          const report = JSON.parse(await readFile(process.env.RUNNER_TEMP + "/calora-production-recipe-image-qa.json", "utf8"));
          if (report.result !== "pass") {
            console.error("::error::Production recipe-image QA did not pass. Review the sanitized artifact.");
            process.exit(1);
          }
          NODE

      - name: Upload sanitized QA evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: calora-production-recipe-image-qa-${{ github.run_id }}
          path: ${{ runner.temp }}/calora-production-recipe-image-qa.json
          if-no-files-found: ignore
          retention-days: 14
