kind = "mobile"
previewPath = "/"
title = "Calora"
description = "A fast, trustworthy calorie and nutrition tracker for iOS and Android, built around verified food data, low-friction logging, adaptive goals, and a calm daily experience."
version = "1.0.0"
id = "artifacts/calora"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 25115

[services.development]
run = "pnpm --filter @workspace/calora run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/calora", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/calora", "run", "serve" ]

[services.env]
PORT = "25115"
BASE_PATH = "/"
