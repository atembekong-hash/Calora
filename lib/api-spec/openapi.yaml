openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: profile
    description: User profile and consent
  - name: diary
    description: Food diary entries
  - name: foods
    description: Verified food search
  - name: weights
    description: Weight trend entries
  - name: sync
    description: Offline outbox synchronization
  - name: privacy
    description: Data export and deletion
  - name: recipes
    description: Open-source recipe discovery
  - name: capture
    description: Smart camera capture and food recognition
  - name: planner
    description: Personalized weekly meal planning
  - name: coach
    description: Context-aware nutrition coaching
  - name: referral
    description: Invite-a-friend referral rewards
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /v1/profile:
    get:
      operationId: getProfile
      tags: [profile]
      summary: Get the current profile
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Current profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
    put:
      operationId: updateProfile
      tags: [profile]
      summary: Create or update the current profile
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileInput"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
  /v1/diary:
    get:
      operationId: listDiaryEntries
      tags: [diary]
      summary: List diary entries for a date
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/DateQuery"
      responses:
        "200":
          description: Diary entries
          content:
            application/json:
              schema:
                type: object
                required: [date, entries]
                properties:
                  date:
                    type: string
                    format: date
                  entries:
                    type: array
                    items:
                      $ref: "#/components/schemas/DiaryEntry"
    post:
      operationId: createDiaryEntry
      tags: [diary]
      summary: Add a diary entry
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiaryEntryInput"
      responses:
        "201":
          description: Created diary entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiaryEntry"
  /v1/diary/{entryId}:
    patch:
      operationId: updateDiaryEntry
      tags: [diary]
      summary: Edit a diary entry
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/EntryId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiaryEntryPatch"
      responses:
        "200":
          description: Updated diary entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiaryEntry"
    delete:
      operationId: deleteDiaryEntry
      tags: [diary]
      summary: Delete a diary entry
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/EntryId"
      responses:
        "204":
          description: Entry deleted
  /v1/foods/search:
    get:
      operationId: searchFoods
      tags: [foods]
      summary: Search verified foods and brands
      security: [{ bearerAuth: [] }]
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 2
        - name: barcode
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        "200":
          description: Matching verified foods
          content:
            application/json:
              schema:
                type: object
                required: [items, provenance]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/FoodItem"
                  provenance:
                    $ref: "#/components/schemas/Provenance"
  /v1/weights:
    get:
      operationId: listWeights
      tags: [weights]
      summary: List weight entries
      security: [{ bearerAuth: [] }]
      parameters:
        - name: from
          in: query
          required: false
          schema: { type: string, format: date }
        - name: to
          in: query
          required: false
          schema: { type: string, format: date }
      responses:
        "200":
          description: Weight entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WeightEntry"
    post:
      operationId: createWeight
      tags: [weights]
      summary: Add a weight entry
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WeightEntryInput"
      responses:
        "201":
          description: Created weight entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WeightEntry"
  /v1/sync:
    post:
      operationId: syncOutbox
      tags: [sync]
      summary: Apply offline mutations and return merged records
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyncRequest"
      responses:
        "200":
          description: Conflict-safe sync result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncResponse"
  /v1/recipes:
    get:
      operationId: listRecipes
      tags: [recipes]
      summary: Browse open-source recipes
      parameters:
        - name: query
          in: query
          required: false
          schema: { type: string, maxLength: 120 }
        - name: category
          in: query
          required: false
          schema: { type: string, maxLength: 80 }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 30, default: 12 }
        - name: offset
          in: query
          required: false
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: Recipe cards
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecipeList"
  /v1/recipes/{recipeId}:
    get:
      operationId: getRecipe
      tags: [recipes]
      summary: Get an open-source recipe detail
      parameters:
        - name: recipeId
          in: path
          required: true
          schema: { type: string, minLength: 1 }
      responses:
        "200":
          description: Recipe detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Recipe"
  /v1/capture/analyze:
    post:
      operationId: analyzeCapture
      tags: [capture]
      summary: Analyze a barcode or food photo for review
      security: [{ bearerAuth: [] }]
      description: |
        Accepts either a barcode or a base64-encoded camera image. Barcode
        requests are enriched from public nutrition sources and food photos
        are analyzed by managed vision. Results remain review-only until the
        user explicitly adds them to the diary.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CaptureAnalyzeInput"
      responses:
        "200":
          description: Reviewable capture result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaptureAnalysis"
        "400":
          description: Invalid capture input
        "502":
          description: Capture provider unavailable
  /v1/capture/{sessionId}/approve:
    post:
      operationId: approveCapture
      tags: [capture]
      summary: Confirm a reviewed image or barcode capture
      description: |
        Consumes the authenticated user's short-lived, server-issued capture
        proof. Only confirmed photo or barcode captures can qualify a referral
        reward; text/manual and demo diary entries cannot.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: sessionId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Capture confirmed
        "401":
          description: Not signed in
        "409":
          description: Capture expired, already used, or belongs to another account
  /v1/planner/generate:
    post:
      operationId: generatePlanner
      tags: [planner]
      summary: Generate a personalized weekly meal plan
      description: |
        Uses the user's goals and preferences to select a reviewable weekly
        meal plan from Calora's nutrition-labeled meal catalog. The client
        keeps the resulting plan locally for offline use.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlannerGenerateInput"
      responses:
        "200":
          description: Generated weekly meal plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlannerGenerateResponse"
        "400":
          description: Invalid planner input
        "502":
          description: Planner provider unavailable
  /v1/coach/respond:
    post:
      operationId: respondCoach
      tags: [coach]
      summary: Respond to a context-aware nutrition coaching request
      description: |
        Interprets a bounded, user-controlled Calora context snapshot and
        returns structured guidance with evidence and allowlisted destinations.
        Coach responses do not mutate diary, planner, or profile data.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CoachRespondInput"
      responses:
        "200":
          description: Structured coach response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoachResponse"
        "400":
          description: Invalid coach input
        "502":
          description: Coach provider unavailable
  /v1/privacy/export:
    post:
      operationId: requestDataExport
      tags: [privacy]
      summary: Request a portable data export
      security: [{ bearerAuth: [] }]
      responses:
        "202":
          description: Export request accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExportRequest"
  /v1/privacy/delete:
    post:
      operationId: requestDataDeletion
      tags: [privacy]
      summary: Request deletion of the account and its data
      security: [{ bearerAuth: [] }]
      responses:
        "202":
          description: Deletion request accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeletionRequest"
  /v1/referral:
    get:
      operationId: getReferral
      tags: [referral]
      summary: Get the caller's referral code, invite link, and reward stats
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Referral summary for the authenticated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReferralSummary"
        "401":
          description: Missing or invalid token
  /v1/referral/redeem:
    post:
      operationId: redeemReferral
      tags: [referral]
      summary: Redeem an invite code on a new account
      description: |
        Records a pending referral redemption for the authenticated user.
        Rewards unlock for both parties once the new user logs their first
        approved food entry. One redemption per account; self-referrals are
        rejected.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReferralRedeemInput"
      responses:
        "200":
          description: Redemption recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReferralRedeemResult"
        "400":
          description: Invalid or self-referral code
        "401":
          description: Missing or invalid token
        "404":
          description: Unknown invite code
        "409":
          description: Account already redeemed an invite code
  /v1/diary/first-log:
    post:
      operationId: syncFirstDiaryEntry
      tags: [diary]
      summary: Persist the user's first approved food log on the server
      description: |
        The diary is local-first; this endpoint durably records the user's
        first approved food log server-side. It is the server-observable
        signal that referral activation requires before granting rewards.
        Idempotent — once any diary entry exists for the user, repeat calls
        return the existing state without writing again.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiaryFirstLogInput"
      responses:
        "200":
          description: Diary entry persisted (or already present)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiaryFirstLogResult"
        "400":
          description: Invalid entry payload
        "401":
          description: Missing or invalid token
  /v1/referral/activate:
    post:
      operationId: activateReferral
      tags: [referral]
      summary: Unlock referral rewards after the first approved food log
      description: |
        Called once the referred user records their first approved food log.
        Grants seven days of Pro to both parties (the referrer's grant is
        subject to a monthly cap). Idempotent — repeat calls return the
        current state without granting again.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Activation state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReferralActivateResult"
        "401":
          description: Missing or invalid token
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    DateQuery:
      name: date
      in: query
      required: true
      schema:
        type: string
        format: date
    EntryId:
      name: entryId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ProfileInput:
      type: object
      required: [name, goal, activity, diet, age, heightCm, weightKg, targetWeightKg, calorieTarget, consentVersion]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        goal: { type: string, enum: [lose, maintain, gain] }
        activity: { type: string, enum: [low, moderate, high] }
        diet: { type: string, enum: [Everything, Vegetarian, Vegan, "High protein"] }
        age: { type: integer, minimum: 13, maximum: 120 }
        heightCm: { type: number, minimum: 80, maximum: 250 }
        weightKg: { type: number, minimum: 25, maximum: 500 }
        targetWeightKg: { type: number, minimum: 25, maximum: 500 }
        calorieTarget: { type: integer, minimum: 800, maximum: 10000 }
        consentVersion: { type: string, minLength: 1 }
    Profile:
      allOf:
        - $ref: "#/components/schemas/ProfileInput"
        - type: object
          required: [updatedAt]
          properties:
            updatedAt: { type: string, format: date-time }
    Provenance:
      type: object
      required: [source, verifiedAt, correctionVersion]
      properties:
        source: { type: string }
        verifiedAt: { type: string, format: date-time, nullable: true }
        correctionVersion: { type: integer, minimum: 1 }
    FoodItem:
      type: object
      required: [id, name, servingAmount, servingUnit, calories, proteinG, carbsG, fatG, provenance]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        brand: { type: string, nullable: true }
        barcode: { type: string, nullable: true }
        servingAmount: { type: number }
        servingUnit: { type: string }
        calories: { type: number }
        proteinG: { type: number }
        carbsG: { type: number }
        fatG: { type: number }
        provenance: { $ref: "#/components/schemas/Provenance" }
    DiaryEntryInput:
      type: object
      required: [entryDate, meal, name, serving, calories, proteinG, carbsG, fatG, provenance, confidence, clientUpdatedAt]
      properties:
        entryDate: { type: string, format: date }
        meal: { type: string, enum: [Breakfast, Lunch, Dinner, Snack] }
        name: { type: string, minLength: 1 }
        serving: { type: string, minLength: 1 }
        calories: { type: number, minimum: 0 }
        proteinG: { type: number, minimum: 0 }
        carbsG: { type: number, minimum: 0 }
        fatG: { type: number, minimum: 0 }
        provenance: { type: string, enum: ["USDA verified", "Brand verified", "Barcode verified", "Photo estimate", Manual, Recipe] }
        confidence: { type: integer, minimum: 0, maximum: 100 }
        clientUpdatedAt: { type: string, format: date-time }
        notes: { type: string, nullable: true }
    DiaryEntry:
      allOf:
        - $ref: "#/components/schemas/DiaryEntryInput"
        - type: object
          required: [id, updatedAt]
          properties:
            id: { type: string, format: uuid }
            updatedAt: { type: string, format: date-time }
    DiaryEntryPatch:
      type: object
      minProperties: 1
      properties:
        meal: { type: string, enum: [Breakfast, Lunch, Dinner, Snack] }
        serving: { type: string }
        calories: { type: number, minimum: 0 }
        proteinG: { type: number, minimum: 0 }
        carbsG: { type: number, minimum: 0 }
        fatG: { type: number, minimum: 0 }
        notes: { type: string, nullable: true }
        clientUpdatedAt: { type: string, format: date-time }
    WeightEntryInput:
      type: object
      required: [entryDate, weightKg, source, clientUpdatedAt]
      properties:
        entryDate: { type: string, format: date }
        weightKg: { type: number, minimum: 25, maximum: 500 }
        source: { type: string, enum: [manual, health] }
        clientUpdatedAt: { type: string, format: date-time }
    WeightEntry:
      allOf:
        - $ref: "#/components/schemas/WeightEntryInput"
        - type: object
          required: [id, createdAt]
          properties:
            id: { type: string, format: uuid }
            createdAt: { type: string, format: date-time }
    SyncMutation:
      type: object
      required: [mutationId, entity, operation, clientUpdatedAt, payload]
      properties:
        mutationId: { type: string, format: uuid }
        entity: { type: string, enum: [profile, diaryEntry, weight, savedMeal] }
        operation: { type: string, enum: [upsert, delete] }
        clientUpdatedAt: { type: string, format: date-time }
        payload: { type: object, additionalProperties: true }
    SyncRequest:
      type: object
      required: [deviceId, mutations]
      properties:
        deviceId: { type: string, minLength: 1 }
        cursor: { type: string, nullable: true }
        mutations:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/SyncMutation" }
    SyncConflict:
      type: object
      required: [mutationId, reason]
      properties:
        mutationId: { type: string, format: uuid }
        reason: { type: string, enum: [stale_write, validation_failed, unauthorized] }
        serverRecord: { type: object, nullable: true, additionalProperties: true }
    SyncResponse:
      type: object
      required: [accepted, conflicts, nextCursor]
      properties:
        accepted: { type: array, items: { type: string, format: uuid } }
        conflicts: { type: array, items: { $ref: "#/components/schemas/SyncConflict" } }
        nextCursor: { type: string }
    ExportRequest:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [queued, ready] }
        downloadUrl: { type: string, format: uri, nullable: true }
    DeletionRequest:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [queued, complete] }
    RecipeList:
      type: object
      required: [recipes, source]
      properties:
        source: { type: string }
        recipes:
          type: array
          items: { $ref: "#/components/schemas/Recipe" }
        warmupPending:
          type: boolean
          description: >
            True while the server's background nutrition warm-up is still
            running.  Clients should refetch the list shortly so recipe cards
            can show calorie estimates as soon as they are available.
    Recipe:
      type: object
      required: [id, name, source, sourceUrl]
      properties:
        id: { type: string }
        name: { type: string }
        image: { type: string, format: uri, nullable: true }
        category: { type: string, nullable: true }
        area: { type: string, nullable: true }
        description: { type: string, nullable: true }
        instructions: { type: string, nullable: true }
        ingredients:
          type: array
          items: { type: string }
        tags:
          type: array
          items: { type: string }
        prepMinutes: { type: integer, nullable: true }
        calories: { type: number, nullable: true }
        proteinG: { type: number, nullable: true }
        carbsG: { type: number, nullable: true }
        fatG: { type: number, nullable: true }
        nutritionUnavailable:
          type: boolean
          description: >
            True when the server attempted AI nutrition estimation but it
            failed (timeout, nonsensical result, or API error). The client
            should surface a clear "Nutrition unavailable" label and offer a
            retry rather than silently showing blanks.
        source: { type: string }
        sourceUrl: { type: string, format: uri }
    CaptureAnalyzeInput:
      type: object
      required: [mode]
      properties:
        mode:
          type: string
          enum: [auto, barcode, food, text, nutrition_label, voice, receipt]
        barcode:
          type: string
          minLength: 8
          maxLength: 32
        imageBase64:
          type: string
          description: JPEG or PNG image bytes encoded as base64 without a data URI prefix
          maxLength: 12000000
        textInput:
          type: string
          description: Natural-language food description (text and voice modes) or any supplementary description
          maxLength: 2000
        audioBase64:
          type: string
          description: Short voice recording encoded as base64 without a data URI prefix. Used only to produce an immediate transcript and not retained.
          maxLength: 8000000
        audioFormat:
          type: string
          enum: [mp4, m4a, wav, webm]
          description: File container for audioBase64
        clientSessionId:
          type: string
          maxLength: 120
    CaptureCandidate:
      type: object
      required: [id, name, serving, calories, proteinG, carbsG, fatG, confidence, provenance, sourceLabel, editable]
      properties:
        id: { type: string }
        name: { type: string }
        brand: { type: string, nullable: true }
        serving: { type: string }
        calories: { type: number, minimum: 0 }
        proteinG: { type: number, minimum: 0 }
        carbsG: { type: number, minimum: 0 }
        fatG: { type: number, minimum: 0 }
        confidence: { type: integer, minimum: 0, maximum: 100 }
        provenance: { type: string }
        sourceLabel: { type: string }
        editable: { type: boolean }
    CaptureConfidence:
      type: object
      required: [identity, portion, nutritionSource, preparation]
      properties:
        identity: { type: integer, minimum: 0, maximum: 100 }
        portion: { type: integer, minimum: 0, maximum: 100 }
        nutritionSource: { type: integer, minimum: 0, maximum: 100 }
        preparation: { type: integer, minimum: 0, maximum: 100 }
    CaptureNutritionRange:
      type: object
      required: [caloriesLow, caloriesHigh]
      properties:
        caloriesLow: { type: number, minimum: 0 }
        caloriesHigh: { type: number, minimum: 0 }
    CaptureComponent:
      allOf:
        - $ref: "#/components/schemas/CaptureCandidate"
        - type: object
          required: [componentId, included, eatenFraction, confidenceDimensions]
          properties:
            componentId: { type: string }
            preparation: { type: string, nullable: true }
            included: { type: boolean }
            eatenFraction: { type: number, minimum: 0, maximum: 1 }
            confidenceDimensions: { $ref: "#/components/schemas/CaptureConfidence" }
            assumptions:
              type: array
              items: { type: string }
            nutritionRange: { $ref: "#/components/schemas/CaptureNutritionRange" }
            reviewQuestions:
              type: array
              items: { type: string }
    CaptureAnalysis:
      type: object
      required: [sessionId, mode, status, title, candidates, reviewMessage, provider]
      properties:
        sessionId: { type: string }
        mode: { type: string, enum: [barcode, food, text, nutrition_label, voice, receipt] }
        status: { type: string, enum: [review, transcript, unavailable] }
        title: { type: string }
        reviewMessage: { type: string }
        provider: { type: string }
        candidates:
          type: array
          items:
            $ref: "#/components/schemas/CaptureCandidate"
        components:
          type: array
          items:
            $ref: "#/components/schemas/CaptureComponent"
        assumptions:
          type: array
          items: { type: string }
        reviewQuestions:
          type: array
          items: { type: string }
        transcript:
          type: string
          description: Editable speech transcript returned before nutrition analysis. Raw audio is discarded after this response.
        imageRetention:
          type: string
          enum: [delete_after_analysis, local_only, retained_with_consent]
    PlannerProfile:
      type: object
      required: [goal, activity, diet, calorieTarget]
      properties:
        goal: { type: string, enum: [lose, maintain, gain] }
        activity: { type: string, enum: [low, moderate, high] }
        diet: { type: string, enum: [Everything, Vegetarian, Vegan, High protein] }
        calorieTarget: { type: integer, minimum: 800, maximum: 10000 }
    PlannerGenerateInput:
      type: object
      required: [weekStart, profile]
      properties:
        weekStart:
          type: string
          format: date
        profile:
          $ref: "#/components/schemas/PlannerProfile"
        planType:
          type: string
          description: Optional plan style identifier guiding AI generation
    PlannerMeal:
      type: object
      required: [id, day, meal, name, image, serving, calories, proteinG, carbsG, fatG, ingredients, description]
      properties:
        id: { type: string }
        day: { type: string, format: date }
        meal: { type: string, enum: [Breakfast, Lunch, Dinner, Snack] }
        name: { type: string }
        image: { type: string, format: uri }
        serving: { type: string }
        calories: { type: number, minimum: 0 }
        proteinG: { type: number, minimum: 0 }
        carbsG: { type: number, minimum: 0 }
        fatG: { type: number, minimum: 0 }
        ingredients:
          type: array
          items: { type: string }
        description: { type: string }
        prepMinutes: { type: integer, minimum: 0 }
    PlannerGenerateResponse:
      type: object
      required: [weekStart, provider, message, meals]
      properties:
        weekStart: { type: string, format: date }
        provider: { type: string }
        message: { type: string }
        meals:
          type: array
          items:
            $ref: "#/components/schemas/PlannerMeal"
    CoachMessage:
      type: object
      required: [role, content]
      properties:
        role: { type: string, enum: [user, assistant] }
        content: { type: string, minLength: 1, maxLength: 3000 }
    CoachDateRange:
      type: object
      required: [start, end]
      properties:
        start: { type: string, format: date }
        end: { type: string, format: date }
    CoachContext:
      type: object
      required: [schemaVersion, generatedAt, currentDate, dateRange, profile, dailySummaries, recentEntries, wellness, planning, foodMemory, missingData]
      properties:
        schemaVersion: { type: integer, minimum: 1 }
        generatedAt: { type: string, format: date-time }
        currentDate: { type: string, format: date }
        dateRange: { $ref: "#/components/schemas/CoachDateRange" }
        profile:
          type: object
          nullable: true
          properties:
            name: { type: string }
            goal: { type: string, enum: [lose, maintain, gain] }
            activity: { type: string, enum: [low, moderate, high] }
            diet: { type: string, enum: [Everything, Vegetarian, Vegan, High protein] }
            calorieTarget: { type: integer, minimum: 0 }
            weightKg: { type: number, minimum: 0 }
            targetWeightKg: { type: number, minimum: 0 }
            age: { type: integer, minimum: 0 }
        dailySummaries:
          type: array
          maxItems: 31
          items:
            type: object
            required: [date, calories, proteinG, carbsG, fatG, meals, waterOunces, hasData]
            properties:
              date: { type: string, format: date }
              calories: { type: number, minimum: 0 }
              proteinG: { type: number, minimum: 0 }
              carbsG: { type: number, minimum: 0 }
              fatG: { type: number, minimum: 0 }
              fiberG: { type: number, minimum: 0 }
              sugarG: { type: number, minimum: 0 }
              sodiumMg: { type: number, minimum: 0 }
              meals: { type: integer, minimum: 0 }
              waterOunces: { type: number, minimum: 0 }
              mood: { type: string, nullable: true }
              activity: { type: string, nullable: true }
              hasData: { type: boolean }
        recentEntries:
          type: array
          maxItems: 80
          items:
            type: object
            required: [date, meal, name, calories, proteinG, carbsG, fatG, source, confidence]
            properties:
              date: { type: string, format: date }
              meal: { type: string }
              name: { type: string, maxLength: 160 }
              calories: { type: number, minimum: 0 }
              proteinG: { type: number, minimum: 0 }
              carbsG: { type: number, minimum: 0 }
              fatG: { type: number, minimum: 0 }
              fiberG: { type: number, minimum: 0 }
              sugarG: { type: number, minimum: 0 }
              sodiumMg: { type: number, minimum: 0 }
              source: { type: string }
              confidence: { type: integer, minimum: 0, maximum: 100 }
        wellness:
          type: object
          required: [waterAverageOunces, waterLoggedDays, moodLoggedDays, activityLoggedDays, weightEntries, latestWeightKg]
          properties:
            waterAverageOunces: { type: number, minimum: 0 }
            waterLoggedDays: { type: integer, minimum: 0 }
            moodLoggedDays: { type: integer, minimum: 0 }
            activityLoggedDays: { type: integer, minimum: 0 }
            weightEntries: { type: integer, minimum: 0 }
            latestWeightKg: { type: number, minimum: 0, nullable: true }
            weightChangeKg: { type: number, nullable: true }
        planning:
          type: object
          required: [plannedMealCount, shoppingItemCount, savedMealNames, savedRecipeCount]
          properties:
            plannedMealCount: { type: integer, minimum: 0 }
            shoppingItemCount: { type: integer, minimum: 0 }
            savedMealNames:
              type: array
              maxItems: 20
              items: { type: string, maxLength: 120 }
            savedRecipeCount: { type: integer, minimum: 0 }
        foodMemory:
          type: object
          required: [acceptedCount, repeatPatterns, verifiedShare, estimatedShare]
          properties:
            acceptedCount: { type: integer, minimum: 0 }
            repeatPatterns:
              type: array
              maxItems: 20
              items: { type: string, maxLength: 120 }
            verifiedShare: { type: integer, minimum: 0, maximum: 100 }
            estimatedShare: { type: integer, minimum: 0, maximum: 100 }
        missingData:
          type: array
          maxItems: 20
          items: { type: string }
    CoachRespondInput:
      type: object
      required: [context, messages, currentScreen]
      properties:
        context:
          $ref: "#/components/schemas/CoachContext"
        messages:
          type: array
          minItems: 1
          maxItems: 12
          items:
            $ref: "#/components/schemas/CoachMessage"
        currentScreen: { type: string, minLength: 1, maxLength: 64 }
    CoachObservation:
      type: object
      required: [text, confidence, evidenceKeys]
      properties:
        text: { type: string, maxLength: 500 }
        confidence: { type: string, enum: [high, medium, limited] }
        evidenceKeys:
          type: array
          maxItems: 6
          items: { type: string }
    CoachAction:
      type: object
      required: [id, label, kind, destination, confirmationRequired]
      properties:
        id: { type: string }
        label: { type: string, maxLength: 80 }
        kind: { type: string, enum: [navigate, prepare] }
        destination: { type: string, enum: [home, progress, recipes, planner, scan, profile] }
        params:
          type: object
          additionalProperties: { type: string, maxLength: 120 }
        confirmationRequired: { type: boolean }
    CoachResponse:
      type: object
      required: [message, observations, actions, safetyState, limitations, contextCoverage]
      properties:
        message: { type: string, maxLength: 2000 }
        observations:
          type: array
          maxItems: 4
          items:
            $ref: "#/components/schemas/CoachObservation"
        actions:
          type: array
          maxItems: 3
          items:
            $ref: "#/components/schemas/CoachAction"
        safetyState: { type: string, enum: [normal, caution, support_redirect] }
        limitations:
          type: array
          maxItems: 4
          items: { type: string, maxLength: 240 }
        contextCoverage:
          type: object
          required: [usedSections, missingSections]
          properties:
            usedSections:
              type: array
              items: { type: string }
            missingSections:
              type: array
              items: { type: string }

    ReferralSummary:
      type: object
      required: [code, inviteUrl, rewardDays, stats, redemption]
      properties:
        code: { type: string, minLength: 4, maxLength: 16 }
        inviteUrl: { type: string, format: uri }
        rewardDays: { type: integer }
        stats:
          type: object
          required: [pendingCount, rewardedCount, monthRewardedCount, monthCap]
          properties:
            pendingCount: { type: integer }
            rewardedCount: { type: integer }
            monthRewardedCount: { type: integer }
            monthCap: { type: integer }
        redemption:
          type: object
          description: The caller's own redemption of someone else's code, if any.
          required: [status]
          properties:
            status: { type: string, enum: [none, pending, rewarded] }
            code: { type: string }
    ReferralRedeemInput:
      type: object
      required: [code]
      properties:
        code: { type: string, minLength: 4, maxLength: 16 }
    ReferralRedeemResult:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [pending] }
        message: { type: string }
    DiaryFirstLogInput:
      type: object
      required: [captureSessionId, entryDate, meal, name, serving, calories, proteinG, carbsG, fatG, provenance, confidence, clientUpdatedAt]
      properties:
        captureSessionId:
          type: string
          format: uuid
          description: |
            Server-issued capture session id returned by /v1/capture/analyze
            for an authenticated request. The synced entry must correspond to
            that server-recorded analysis; fabricated payloads are rejected.
        entryDate: { type: string, format: date }
        meal: { type: string, minLength: 1, maxLength: 40 }
        name: { type: string, minLength: 1, maxLength: 200 }
        serving: { type: string, minLength: 1, maxLength: 120 }
        calories: { type: number, minimum: 0, maximum: 20000 }
        proteinG: { type: number, minimum: 0, maximum: 5000 }
        carbsG: { type: number, minimum: 0, maximum: 5000 }
        fatG: { type: number, minimum: 0, maximum: 5000 }
        provenance: { type: string, minLength: 1, maxLength: 80 }
        confidence: { type: integer, minimum: 0, maximum: 100 }
        notes: { type: string, maxLength: 2000 }
        clientUpdatedAt: { type: string, format: date-time }
    DiaryFirstLogResult:
      type: object
      required: [synced, alreadyExisted]
      properties:
        synced: { type: boolean }
        alreadyExisted: { type: boolean }
    ReferralActivateResult:
      type: object
      required: [status, referredRewarded, referrerRewarded]
      properties:
        status: { type: string, enum: [none, pending, rewarded] }
        referredRewarded: { type: boolean }
        referrerRewarded: { type: boolean }
        message: { type: string }
