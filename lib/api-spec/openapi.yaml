openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: profile
    description: User profile and consent
  - name: diary
    description: Food diary entries
  - name: foods
    description: Verified food search
  - name: weights
    description: Weight trend entries
  - name: sync
    description: Offline outbox synchronization
  - name: privacy
    description: Data export and deletion
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /v1/profile:
    get:
      operationId: getProfile
      tags: [profile]
      summary: Get the current profile
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Current profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
    put:
      operationId: updateProfile
      tags: [profile]
      summary: Create or update the current profile
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileInput"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
  /v1/diary:
    get:
      operationId: listDiaryEntries
      tags: [diary]
      summary: List diary entries for a date
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/DateQuery"
      responses:
        "200":
          description: Diary entries
          content:
            application/json:
              schema:
                type: object
                required: [date, entries]
                properties:
                  date:
                    type: string
                    format: date
                  entries:
                    type: array
                    items:
                      $ref: "#/components/schemas/DiaryEntry"
    post:
      operationId: createDiaryEntry
      tags: [diary]
      summary: Add a diary entry
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiaryEntryInput"
      responses:
        "201":
          description: Created diary entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiaryEntry"
  /v1/diary/{entryId}:
    patch:
      operationId: updateDiaryEntry
      tags: [diary]
      summary: Edit a diary entry
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/EntryId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiaryEntryPatch"
      responses:
        "200":
          description: Updated diary entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiaryEntry"
    delete:
      operationId: deleteDiaryEntry
      tags: [diary]
      summary: Delete a diary entry
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/EntryId"
      responses:
        "204":
          description: Entry deleted
  /v1/foods/search:
    get:
      operationId: searchFoods
      tags: [foods]
      summary: Search verified foods and brands
      security: [{ bearerAuth: [] }]
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 2
        - name: barcode
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        "200":
          description: Matching verified foods
          content:
            application/json:
              schema:
                type: object
                required: [items, provenance]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/FoodItem"
                  provenance:
                    $ref: "#/components/schemas/Provenance"
  /v1/weights:
    get:
      operationId: listWeights
      tags: [weights]
      summary: List weight entries
      security: [{ bearerAuth: [] }]
      parameters:
        - name: from
          in: query
          required: false
          schema: { type: string, format: date }
        - name: to
          in: query
          required: false
          schema: { type: string, format: date }
      responses:
        "200":
          description: Weight entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WeightEntry"
    post:
      operationId: createWeight
      tags: [weights]
      summary: Add a weight entry
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WeightEntryInput"
      responses:
        "201":
          description: Created weight entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WeightEntry"
  /v1/sync:
    post:
      operationId: syncOutbox
      tags: [sync]
      summary: Apply offline mutations and return merged records
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyncRequest"
      responses:
        "200":
          description: Conflict-safe sync result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncResponse"
  /v1/privacy/export:
    post:
      operationId: requestDataExport
      tags: [privacy]
      summary: Request a portable data export
      security: [{ bearerAuth: [] }]
      responses:
        "202":
          description: Export request accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExportRequest"
  /v1/privacy/delete:
    post:
      operationId: requestDataDeletion
      tags: [privacy]
      summary: Request deletion of the account and its data
      security: [{ bearerAuth: [] }]
      responses:
        "202":
          description: Deletion request accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeletionRequest"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    DateQuery:
      name: date
      in: query
      required: true
      schema:
        type: string
        format: date
    EntryId:
      name: entryId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ProfileInput:
      type: object
      required: [name, goal, activity, diet, age, heightCm, weightKg, targetWeightKg, calorieTarget, consentVersion]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        goal: { type: string, enum: [lose, maintain, gain] }
        activity: { type: string, enum: [low, moderate, high] }
        diet: { type: string, enum: [Everything, Vegetarian, Vegan, "High protein"] }
        age: { type: integer, minimum: 13, maximum: 120 }
        heightCm: { type: number, minimum: 80, maximum: 250 }
        weightKg: { type: number, minimum: 25, maximum: 500 }
        targetWeightKg: { type: number, minimum: 25, maximum: 500 }
        calorieTarget: { type: integer, minimum: 800, maximum: 10000 }
        consentVersion: { type: string, minLength: 1 }
    Profile:
      allOf:
        - $ref: "#/components/schemas/ProfileInput"
        - type: object
          required: [updatedAt]
          properties:
            updatedAt: { type: string, format: date-time }
    Provenance:
      type: object
      required: [source, verifiedAt, correctionVersion]
      properties:
        source: { type: string }
        verifiedAt: { type: string, format: date-time, nullable: true }
        correctionVersion: { type: integer, minimum: 1 }
    FoodItem:
      type: object
      required: [id, name, servingAmount, servingUnit, calories, proteinG, carbsG, fatG, provenance]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        brand: { type: string, nullable: true }
        barcode: { type: string, nullable: true }
        servingAmount: { type: number }
        servingUnit: { type: string }
        calories: { type: number }
        proteinG: { type: number }
        carbsG: { type: number }
        fatG: { type: number }
        provenance: { $ref: "#/components/schemas/Provenance" }
    DiaryEntryInput:
      type: object
      required: [entryDate, meal, name, serving, calories, proteinG, carbsG, fatG, provenance, confidence, clientUpdatedAt]
      properties:
        entryDate: { type: string, format: date }
        meal: { type: string, enum: [Breakfast, Lunch, Dinner, Snack] }
        name: { type: string, minLength: 1 }
        serving: { type: string, minLength: 1 }
        calories: { type: number, minimum: 0 }
        proteinG: { type: number, minimum: 0 }
        carbsG: { type: number, minimum: 0 }
        fatG: { type: number, minimum: 0 }
        provenance: { type: string, enum: ["USDA verified", "Brand verified", "Photo estimate", Manual, Recipe] }
        confidence: { type: integer, minimum: 0, maximum: 100 }
        clientUpdatedAt: { type: string, format: date-time }
        notes: { type: string, nullable: true }
    DiaryEntry:
      allOf:
        - $ref: "#/components/schemas/DiaryEntryInput"
        - type: object
          required: [id, updatedAt]
          properties:
            id: { type: string, format: uuid }
            updatedAt: { type: string, format: date-time }
    DiaryEntryPatch:
      type: object
      minProperties: 1
      properties:
        meal: { type: string, enum: [Breakfast, Lunch, Dinner, Snack] }
        serving: { type: string }
        calories: { type: number, minimum: 0 }
        proteinG: { type: number, minimum: 0 }
        carbsG: { type: number, minimum: 0 }
        fatG: { type: number, minimum: 0 }
        notes: { type: string, nullable: true }
        clientUpdatedAt: { type: string, format: date-time }
    WeightEntryInput:
      type: object
      required: [entryDate, weightKg, source, clientUpdatedAt]
      properties:
        entryDate: { type: string, format: date }
        weightKg: { type: number, minimum: 25, maximum: 500 }
        source: { type: string, enum: [manual, health] }
        clientUpdatedAt: { type: string, format: date-time }
    WeightEntry:
      allOf:
        - $ref: "#/components/schemas/WeightEntryInput"
        - type: object
          required: [id, createdAt]
          properties:
            id: { type: string, format: uuid }
            createdAt: { type: string, format: date-time }
    SyncMutation:
      type: object
      required: [mutationId, entity, operation, clientUpdatedAt, payload]
      properties:
        mutationId: { type: string, format: uuid }
        entity: { type: string, enum: [profile, diaryEntry, weight, savedMeal] }
        operation: { type: string, enum: [upsert, delete] }
        clientUpdatedAt: { type: string, format: date-time }
        payload: { type: object, additionalProperties: true }
    SyncRequest:
      type: object
      required: [deviceId, mutations]
      properties:
        deviceId: { type: string, minLength: 1 }
        cursor: { type: string, nullable: true }
        mutations:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/SyncMutation" }
    SyncConflict:
      type: object
      required: [mutationId, reason]
      properties:
        mutationId: { type: string, format: uuid }
        reason: { type: string, enum: [stale_write, validation_failed, unauthorized] }
        serverRecord: { type: object, nullable: true, additionalProperties: true }
    SyncResponse:
      type: object
      required: [accepted, conflicts, nextCursor]
      properties:
        accepted: { type: array, items: { type: string, format: uuid } }
        conflicts: { type: array, items: { $ref: "#/components/schemas/SyncConflict" } }
        nextCursor: { type: string }
    ExportRequest:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [queued, ready] }
        downloadUrl: { type: string, format: uri, nullable: true }
    DeletionRequest:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [queued, complete] }

