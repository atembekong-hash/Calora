kind = "api"
previewPath = "/api" # TODO - should be excluded from preview in the first place
title = "API Server"
version = "1.0.0"
id = "3B4_FFSkEVBkAeYMFRJ2e"

[[services]]
localPort = 8080
name = "API Server"
paths = ["/api", "/.well-known", "/invite"]

[services.development]
run = "pnpm --filter @workspace/api-server run dev"

[services.production]

[services.production.build]
args = ["pnpm", "--filter", "@workspace/api-server", "run", "build"]

[services.production.build.env]
NODE_ENV = "production"
# The following are protected Publishing production secrets, intentionally not
# stored in this artifact definition: RELEASE_ATTESTATION_SIGNING_KEY,
# RELEASE_ATTESTATION_SIGNING_KEY_FINGERPRINT,
# RELEASE_ATTESTATION_ARTIFACT_DIR, and RELEASE_ATTESTATION_MANIFEST_DIR.
# The signer fingerprint only enrolls the build signer; the activation verifier
# uses a separately controlled approval-trust pin. build.mjs fails closed until
# the operator supplies all four.
# A sensitive release additionally requires a provider-issued, Ed25519-signed
# final-package attestation retained outside the workspace. The protected
# publishing pipeline must stage the exact package first, then supply:
# RELEASE_SENSITIVE_ACTIVATION_REQUESTED=true,
# RELEASE_PROVIDER_ATTESTATION_FILE, RELEASE_PROVIDER_ATTESTATION_SIGNATURE_FILE,
# RELEASE_PROVIDER_ATTESTATION_PUBLIC_KEY_FILE,
# RELEASE_PROVIDER_TRUSTED_PUBLIC_KEY_SHA256,
# RELEASE_PROVIDER_DEPLOYMENT_ID, and RELEASE_PROVIDER_TARGET_ORIGIN.
# Normal releases omit RELEASE_SENSITIVE_ACTIVATION_REQUESTED. A requested
# release produces verification-ready provenance for a production rehearsal,
# but the sensitive path remains compiled deny-all until a provider-owned,
# atomic stage→attest→deploy activation contract is separately established.

[services.production.run]
# we don't run through pnpm to make startup faster in production
args = ["node", "--enable-source-maps", "artifacts/api-server/dist/index.mjs"]

[services.production.run.env]
PORT = "8080"
NODE_ENV = "production"

[services.production.health.startup]
path = "/api/healthz"
