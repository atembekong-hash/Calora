# EAS custom build workflow.
#
# Why this exists: EAS Build bundles an older pnpm version that cannot parse
# the repo's lockfile (format v9.0, written by pnpm 10). The default
# eas/install_node_modules step runs `pnpm install --frozen-lockfile`, which
# fails because it treats the unreadable lockfile as absent.
#
# Fix: upgrade pnpm to 10 before the install step runs, then hand off to the
# standard EAS built-in functions for prebuild and the native build.
#
# EAS built-in functions are referenced as bare names (no "uses:" prefix).
# References: https://docs.expo.dev/custom-builds/schema/

build:
  name: Calora
  steps:
    - eas/checkout
    - name: Upgrade pnpm to 10
      run: |
        npm install -g pnpm@10.26.1
        echo "pnpm version: $(pnpm --version)"
    - eas/install_node_modules
    - eas/prebuild
    - eas/run_fastlane
    - eas/run_gradle_build
