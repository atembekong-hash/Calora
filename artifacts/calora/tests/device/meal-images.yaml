appId: com.etiendem.caloraapp
---
# Run this same flow once on a booted iOS simulator and once on a booted
# Android emulator or signed device. The flow intentionally uses clean local
# state so the deep-linked preview is deterministic.
- launchApp:
    clearState: true
- tapOn: "Continue"
- tapOn: "Continue"
- tapOn: "Continue"
- tapOn: "Continue"
- tapOn: "I understand and agree"
- tapOn: "Enter CaloraApp"
- openLink: "caloraapp:///meal-image-preview"
- assertVisible: "Meal image rendering"

# The status line is emitted by the real PlannerMealImage component. The
# negative assertions intentionally run first so a failed card reports its
# meal identity and the observed fallback/swapped state in Maestro output.
- assertNotVisible:
    text: "Breakfast: Overnight oats with berries · Fallback image active"
- assertNotVisible:
    text: "Breakfast: Overnight oats with berries · Swapped image detected"
- extendedWaitUntil:
    visible: "Breakfast: Overnight oats with berries · Bundled image ready"
    timeout: 10000
- assertNotVisible:
    text: "Lunch: Chicken harvest salad · Fallback image active"
- assertNotVisible:
    text: "Lunch: Chicken harvest salad · Swapped image detected"
- extendedWaitUntil:
    visible: "Lunch: Chicken harvest salad · Bundled image ready"
    timeout: 10000
- assertNotVisible:
    text: "Dinner: Mediterranean tomato pasta · Fallback image active"
- assertNotVisible:
    text: "Dinner: Mediterranean tomato pasta · Swapped image detected"
- extendedWaitUntil:
    visible: "Dinner: Mediterranean tomato pasta · Bundled image ready"
    timeout: 10000
- assertVisible:
    id: "meal-image-audit-breakfast-image"
- assertVisible:
    id: "meal-image-audit-lunch-image"
- assertVisible:
    id: "meal-image-audit-dinner-image"

- scrollUntilVisible:
    element:
      text: "Snack: Apple with almond butter · Bundled image ready"
    direction: DOWN
    timeout: 10000
- assertNotVisible:
    text: "Snack: Apple with almond butter · Fallback image active"
- assertNotVisible:
    text: "Snack: Apple with almond butter · Swapped image detected"
- extendedWaitUntil:
    visible: "Snack: Apple with almond butter · Bundled image ready"
    timeout: 10000
- assertVisible:
    id: "meal-image-audit-snack-image"